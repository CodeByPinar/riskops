# =====================================================================
#  RiskOps - Apache VirtualHost
#  Kurulum yeri: /etc/apache2/sites-available/riskops.conf
#
#  TASARIM KARARI
#  --------------
#  Hassas dizin korumaları .htaccess'te DE var, burada DA var.
#  Sebep: .htaccess yalnızca "AllowOverride All" açıkken çalışır.
#  Bir gün performans için AllowOverride kapatılırsa config/, includes/,
#  storage/ ve tools/ dizinleri sessizce açığa çıkardı. VirtualHost
#  içindeki kurallar bu ayardan bağımsızdır ve her koşulda uygulanır.
#
#  Kurulum:
#    sudo cp /var/www/riskops/deploy/riskops.conf /etc/apache2/sites-available/
#    sudo a2enmod headers rewrite
#    sudo apache2ctl configtest
#    sudo systemctl reload apache2
# =====================================================================

<VirtualHost *:80>
    ServerName   riskops.local
    ServerAlias  127.0.0.1 localhost
    DocumentRoot /var/www/riskops

    # -----------------------------------------------------------------
    #  ORTAM
    #  Üretime alırken tek değişiklik budur: production yazıp reload.
    #  Kod dosyalarına dokunmak gerekmez.
    # -----------------------------------------------------------------
    SetEnv RISKOPS_ENV development

    <Directory /var/www/riskops>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # -----------------------------------------------------------------
    #  HASSAS DİZİNLER - .htaccess'e bağımlı DEĞİL
    #
    #  config/   veritabanı parolası
    #  includes/ uygulama mantığı
    #  database/ şema ve seed dosyaları
    #  storage/  loglar, yüklemeler, marka kaynak dosyaları
    #  tools/    seed_demo.php --purge tüm veriyi siler
    #  deploy/   bu dosyanın kendisi
    # -----------------------------------------------------------------
    <DirectoryMatch "^/var/www/riskops/(config|includes|database|storage|tools|deploy)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Gizli, yedek ve yapılandırma dosyaları
    <FilesMatch "(^\.|\.(sql|log|md|bak|old|ini|sh|yml|yaml|json|dist|example|lock)$)">
        Require all denied
    </FilesMatch>

    # -----------------------------------------------------------------
    #  GÜVENLİK BAŞLIKLARI
    #  bootstrap.php bunların bir kısmını PHP tarafında da gönderiyor;
    #  buradakiler statik dosyaları (CSS, JS, font, görsel) de kapsar.
    # -----------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options  "nosniff"
        Header always set X-Frame-Options         "SAMEORIGIN"
        Header always set Referrer-Policy         "strict-origin-when-cross-origin"
        Header always set Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()"

        # CSP: tüm varlıklar aynı kökten gelir, CDN yoktur.
    # -----------------------------------------------------------------
    #  CSP BURADA YOK - BILEREK
    #
    #  Content-Security-Policy artik YALNIZCA PHP tarafindan gonderiliyor
    #  (includes/bootstrap.php). Sebep: style-src bir NONCE iceriyor ve
    #  nonce her istekte yeniden uretilmek zorunda; Apache bunu uretemez.
    #
    #  Iki CSP basligi gonderilseydi tarayici ikisinin KESISIMINI uygular.
    #  Apache'ninki nonce icermedigi icin, PHP'nin izin verdigi <style>
    #  bloklari engellenir ve kategori renkleri kaybolurdu.
    #
    #  Diger guvenlik basliklari burada KALDI: statik dosyalari (CSS, JS,
    #  font, gorsel) da kapsiyorlar ve PHP onlar icin calismiyor.
    # -----------------------------------------------------------------

        Header unset X-Powered-By
        Header always unset X-Powered-By
    </IfModule>

    # Sunucu sürüm bilgisini sızdırma
    ServerSignature Off

    # -----------------------------------------------------------------
    #  STATİK VARLIK ÖNBELLEĞİ
    #  Dosya adlarında ?v=... sürümü var; uzun önbellek güvenli.
    # -----------------------------------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                 "access plus 30 days"
        ExpiresByType application/javascript   "access plus 30 days"
        ExpiresByType text/javascript          "access plus 30 days"
        ExpiresByType font/woff2               "access plus 180 days"
        ExpiresByType image/png                "access plus 30 days"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain text/csv
        AddOutputFilterByType DEFLATE application/javascript application/json
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/riskops-error.log
    CustomLog ${APACHE_LOG_DIR}/riskops-access.log combined
</VirtualHost>

# =====================================================================
#  HTTPS
#  Üretimde uygulama HTTPS üzerinden sunulmalıdır. Oturum çerezi
#  yalnızca HTTPS altında "Secure" işaretlenir (bkz. bootstrap.php);
#  düz HTTP'de oturum kimliği ağda açık gider.
#
#  Sertifika hazır olduğunda aşağıdaki bloğu açın ve 80 portunu
#  yönlendirmeye çevirin.
# =====================================================================
#
# <VirtualHost *:443>
#     ServerName   riskops.kurum.local
#     DocumentRoot /var/www/riskops
#     SetEnv RISKOPS_ENV production
#
#     SSLEngine on
#     SSLCertificateFile    /etc/ssl/certs/riskops.crt
#     SSLCertificateKeyFile /etc/ssl/private/riskops.key
#
#     <IfModule mod_headers.c>
#         Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
#     </IfModule>
#
#     # ... yukarıdaki Directory / FilesMatch / Header blokları buraya da ...
# </VirtualHost>
