# =====================================================================
#  RiskOps - Herkese açık demo VirtualHost (HTTPS)
#  Kurulum yeri: /etc/apache2/sites-available/riskops-demo.conf
#
#  riskops.conf'tan farkı:
#    - HTTPS zorunlu, HTTP yalnızca yönlendirir
#    - RISKOPS_ENV production  (hata ayrıntısı ekrana basılmaz)
#    - RISKOPS_DEMO 1          (giriş ekranında deneme hesabı görünür)
#    - HSTS açık
#    - Arama motorlarına kapalı
#
#  DİKKAT: <DOMAIN> yazan her yeri kendi alan adınızla değiştirin.
#
#  Kurulum sırası:
#    1) Önce bu dosyayı SSL blokları YORUMDA bırakarak kurun
#    2) certbot çalıştırın (sertifika almak için 80 portu gerekir)
#    3) Sonra 443 bloğunu açın
#  Ya da certbot --apache kullanın: 443 bloğunu kendisi üretir.
# =====================================================================

<VirtualHost *:80>
    ServerName   <DOMAIN>
    DocumentRoot /var/www/riskops

    # Let's Encrypt doğrulaması HTTP üzerinden gelir; onu yönlendirme.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    <Directory /var/www/riskops/.well-known>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/riskops-error.log
    CustomLog ${APACHE_LOG_DIR}/riskops-access.log combined
</VirtualHost>


<VirtualHost *:443>
    ServerName   <DOMAIN>
    DocumentRoot /var/www/riskops

    # -----------------------------------------------------------------
    #  ORTAM
    # -----------------------------------------------------------------
    SetEnv RISKOPS_ENV  production
    SetEnv RISKOPS_DEMO 1

    # -----------------------------------------------------------------
    #  SERTİFİKA
    #  certbot --apache kullanırsanız bu üç satırı kendisi yazar.
    # -----------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/<DOMAIN>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/<DOMAIN>/privkey.pem

    <Directory /var/www/riskops>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # -----------------------------------------------------------------
    #  HASSAS DİZİNLER - .htaccess'e bağımlı DEĞİL
    #
    #  tools/ demoda sunucuda KALIR (gece sıfırlaması ona ihtiyaç duyar)
    #  ama web üzerinden erişilemez. demo_reset.php zaten yalnızca CLI'dan
    #  çalışır; bu kural ikinci katman.
    # -----------------------------------------------------------------
    <DirectoryMatch "^/var/www/riskops/(config|includes|database|storage|tools|deploy|docs)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.|\.(sql|log|md|bak|old|ini|sh|yml|yaml|json|dist|example|lock)$)">
        Require all denied
    </FilesMatch>

    # -----------------------------------------------------------------
    #  GÜVENLİK BAŞLIKLARI
    # -----------------------------------------------------------------
    <IfModule mod_headers.c>
        # HSTS: tarayıcı bir daha bu alan adına HTTP ile gitmesin.
        # DİKKAT: preload EKLEMEYİN - geri alması aylar sürer.
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

        Header always set X-Content-Type-Options  "nosniff"
        Header always set X-Frame-Options         "SAMEORIGIN"
        Header always set Referrer-Policy         "strict-origin-when-cross-origin"
        Header always set Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()"

        # 'unsafe-inline' gerekçesi riskops.conf içinde açıklanmıştır.
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

        # Demo verisi gerçek değil; arama sonuçlarında çıkmasın.
        Header always set X-Robots-Tag "noindex, nofollow"

        Header always unset X-Powered-By
    </IfModule>

    ServerSignature Off

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css               "access plus 30 days"
        ExpiresByType application/javascript "access plus 30 days"
        ExpiresByType font/woff2             "access plus 180 days"
        ExpiresByType image/png              "access plus 30 days"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain text/csv
        AddOutputFilterByType DEFLATE application/javascript application/json
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/riskops-error.log
    CustomLog ${APACHE_LOG_DIR}/riskops-access.log combined
</VirtualHost>
