# =====================================================================
#  RiskOps - Apache yapılandırması (konteyner)
#  /etc/apache2/conf-available/riskops.conf
# =====================================================================

# ---------------------------------------------------------------------
#  .htaccess ETKİNLEŞTİRME
#
#  Debian'ın apache2.conf dosyası /var/www/ için AllowOverride None
#  yazar. O hâlde uygulamanın config/, includes/, database/, storage/,
#  tools/ ve deploy/ dizinlerindeki .htaccess korumaları hiç okunmaz.
#  Sonuç sessizdir: hata verilmez, sadece korumalar yoktur.
# ---------------------------------------------------------------------
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# ---------------------------------------------------------------------
#  İKİNCİ KATMAN - .htaccess'e bağımlı DEĞİL
#
#  Yukarıdaki AllowOverride bir gün değişirse ya da bir .htaccess
#  dosyası imaja kopyalanmazsa, hassas dizinler yine de kapalı kalır.
#  Aynı korumayı iki bağımsız yerde tutmanın sebebi budur.
# ---------------------------------------------------------------------
<DirectoryMatch "^/var/www/html/(config|includes|database|storage|tools|deploy|docker|docs)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(^\.|\.(sql|log|md|bak|old|ini|sh|yml|yaml|json|dist|example|lock)$)">
    Require all denied
</FilesMatch>

# ---------------------------------------------------------------------
#  ORTAM DEĞİŞKENLERİ
#
#  config/config.php şu sırayla bakar:
#      $_SERVER['RISKOPS_ENV'] ?? getenv('RISKOPS_ENV')
#
#  PassEnv, docker-compose ile verilen konteyner ortam değişkenini
#  Apache'nin istek ortamına taşır; böylece $_SERVER üzerinden de
#  görünür ve getenv()'in mod_php altındaki davranışına bağlı kalmayız.
# ---------------------------------------------------------------------
PassEnv RISKOPS_ENV
PassEnv RISKOPS_DEMO

# ---------------------------------------------------------------------
#  GÜVENLİK BAŞLIKLARI
#  bootstrap.php bir kısmını PHP tarafında da gönderiyor; buradakiler
#  statik dosyaları (CSS, JS, font, görsel) de kapsar.
# ---------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options  "nosniff"
    Header always set X-Frame-Options         "SAMEORIGIN"
    Header always set Referrer-Policy         "strict-origin-when-cross-origin"
    Header always set Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()"

    # -----------------------------------------------------------------
    #  CSP BURADA YOK - BILEREK
    #
    #  Content-Security-Policy artik YALNIZCA PHP tarafindan gonderiliyor
    #  (includes/bootstrap.php). Sebep: style-src bir NONCE iceriyor ve
    #  nonce her istekte yeniden uretilmek zorunda; Apache bunu uretemez.
    #
    #  Iki CSP basligi gonderilseydi tarayici ikisinin KESISIMINI uygular.
    #  Apache'ninki nonce icermedigi icin, PHP'nin izin verdigi <style>
    #  bloklari engellenir ve kategori renkleri kaybolurdu.
    #
    #  Diger guvenlik basliklari burada KALDI: statik dosyalari (CSS, JS,
    #  font, gorsel) da kapsiyorlar ve PHP onlar icin calismiyor.
    # -----------------------------------------------------------------

    Header always unset X-Powered-By
</IfModule>

ServerSignature Off
ServerTokens Prod

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css               "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
    ExpiresByType font/woff2             "access plus 180 days"
    ExpiresByType image/png              "access plus 30 days"
</IfModule>
